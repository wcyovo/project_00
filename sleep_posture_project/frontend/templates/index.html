<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能床垫 - 睡姿热力图展示</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>🛏️ 智能床垫睡姿识别系统</h1>
            <p class="subtitle">基于压力传感器的睡姿热力图展示</p>
        </header>

        <div class="main-content">
            <!-- 左侧控制面板 -->
            <div class="control-panel">
                <div class="panel-section">
                    <h3>👤 用户选择</h3>
                    <select id="userSelect" onchange="onUserChange()">
                        <option value="">-- 请选择用户 --</option>
                        {% for user in users %}
                        <option value="{{ user }}">{{ user }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="panel-section" id="userInfo" style="display:none;">
                    <h3>📊 用户信息</h3>
                    <div id="userInfoContent">
                        <p><span class="label">用户:</span> <span id="displayUsername">-</span></p>
                        <p><span class="label">总帧数:</span> <span id="displayTotalFrames">-</span></p>
                        <p><span class="label">睡姿分布:</span></p>
                        <div id="postureDistribution"></div>
                    </div>
                </div>

                <div class="panel-section" id="frameControl" style="display:none;">
                    <h3>🎬 帧控制</h3>
                    <div class="frame-controls">
                        <button onclick="prevFrame()">◀ 上一帧</button>
                        <span id="frameInfo">0 / 0</span>
                        <button onclick="nextFrame()">下一帧 ▶</button>
                    </div>
                    <div class="frame-slider">
                        <input type="range" id="frameSlider" min="0" max="0" value="0" 
                               oninput="onSliderChange()">
                    </div>
                </div>

                <div class="panel-section" id="postureFilter" style="display:none;">
                    <h3>🔍 按睡姿筛选</h3>
                    <div id="postureFilterButtons"></div>
                </div>
            </div>

            <!-- 右侧显示区域 -->
            <div class="display-panel">
                <div class="heatmap-container">
                    <div id="heatmapPlaceholder" class="placeholder">
                        <p>👆 请选择用户查看热力图</p>
                        <p class="hint">支持切换不同用户和睡姿</p>
                    </div>
                    <img id="heatmapImage" style="display:none;" alt="热力图">
                </div>
                <div class="heatmap-info" id="heatmapInfo" style="display:none;">
                    <span id="heatmapUser">-</span>
                    <span id="heatmapPosture">-</span>
                    <span id="heatmapFrame">帧 0</span>
                </div>
            </div>
        </div>

        <!-- 统计信息 -->
        <div class="stats-section">
            <h3>📈 全局统计</h3>
            <div id="globalStats">
                <div class="stat-item">
                    <span class="stat-value" id="statTotalFrames">-</span>
                    <span class="stat-label">总帧数</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="statTotalUsers">-</span>
                    <span class="stat-label">用户数</span>
                </div>
                <div class="stat-item" id="postureStats">
                    <!-- 动态生成 -->
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
